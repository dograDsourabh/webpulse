services:
  - type: web
    name: webpulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PAGESPEED_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://dogradsourabh.github.io
